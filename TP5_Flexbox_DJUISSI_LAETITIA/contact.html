<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>contact-mon mini-site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>page de contact</h1>
    <nav>
        <a href="index.html">Accuiel</a>
        <a href="presentation.html">presentation</a>
        <a href="contact.html">contact</a>
        </nav>
        <div class="container">
             <main>
        <div class="section">
           
        <h2>Formulaire de contact</h2>
        <p>veuillez remplir ce formulaire pour envoyer un message</p>
       
    </div>
     </main>
    <aside>
        <form>
            <label for="nom">Nom:</label>
            <input type="text" id="nom" name="nom" placeholder="Entrer votre nom" required>

            <br>
            <br>
            <label for="prenom">prenom:</label>
            <input type="text" id="prenom" name="prenom" placeholder="entre votre prenom" required>
            <br>
            <br>
            <label for="telephone">Telephone</label>
            <input type="tel" name="tel" id="tel" placeholder="+237 6 XX XX XX XX"><br><br>
            <label for="Email">adresse Email:</label>
            <input type="email" name="email" id="email" placeholder="example@email.com">
            <br>
            <br>
            <label for="message">Message :</label> <br><br>
            <textarea id="message"name=message rows="5"cols=40></textarea><br><br> 
           <label for="">Motif du message</label>
           <select id="motif">
           <option value="">-- Choisir un motif --</option>
            <option value="information"> Informations   </option>
             <option value="stage">Demande de stage</option>
              <option value="projet">Proposition de projet</option>
               <option value="autre">Autre demande</option>
             </select>
            <br>
            <br>
            <label for="domaine">Domaine d'interet</label>
            <select name="domaine" id="domaine">
                <option value="">-- Choisir un domaine -- </option>
                  <option value="reseaux">Reseaux informatiques</option>
                    <option value="cybersecurité">Cybersecurité</option>
                      <option value="developpement-web">Developpement web</option>
                        <option value="administration-système">Administration système</option>
            </select><BR><BR></BR>
            <button type="submit">Envoyer</button>
             <button type="reset">Effacer</button>
        </form>
        </aside>
        </div>
            </body>
                </html>
